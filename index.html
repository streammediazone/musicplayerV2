<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Môj Hudobný Prehrávač</title>
    <link rel="stylesheet" href="style.css?v=20261101-14">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="player-shell">
    <div class="player-container">
        <div class="song-image">
            <img src="obrazky/f1 album.jpg" alt="Obal albumu" id="cover">
        </div>
        <h2 id="song-title">Názov Skladby</h2>
        <h3 id="song-artist">Meno Interpreta</h3>
        <span id="song-number" class="song-info">1/27</span>
        <audio id="audio" preload="metadata"></audio>
<div class="progress-container">
            <div class="progress" id="progress"></div>
        </div>
        <div class="duration-wrapper">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <i class="fas fa-backward" id="prev" title="Predchádzajúca"></i>
            <i class="fas fa-play main-button" id="play" title="Prehrať"></i>
            <i class="fas fa-forward" id="next" title="Ďalšia"></i>
        </div>

        <div class="volume-container">
            <i class="fas fa-volume-down"></i>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
            <i class="fas fa-volume-up"></i>
        </div>

        <div class="playback-options">
            <i class="fas fa-redo-alt" id="repeat" title="Opakovať"></i>
            <i class="fas fa-random" id="shuffle" title="Náhodné prehrávanie"></i>
            <i class="fas fa-list" id="toggle-playlist-btn" title="Zoznam skladieb"></i>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Zmeniť farebnú tému" title="Zmeniť farebnú tému"><i class="fas fa-palette" aria-hidden="true"></i></button>
            <button class="skin-toggle" id="skin-toggle" type="button" aria-label="Zmeniť dizajn prehrávača" title="Zmeniť dizajn prehrávača"><i class="fas fa-layer-group" aria-hidden="true"></i></button>
        </div>

    </div>

    <aside class="playlist-container" id="playlist-container" aria-hidden="true" aria-label="Playlist">
        <div class="playlist-header">
            <div>
                <p class="playlist-eyebrow">TVOJA HUDBA</p>
                <h2>Playlist</h2>
                <span id="playlist-count" class="playlist-count">27 skladieb</span>
            </div>
            <button class="playlist-close" id="close-playlist-btn" type="button" aria-label="Zavrieť playlist">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <label class="playlist-search">
            <i class="fas fa-search" aria-hidden="true"></i>
            <input id="playlist-search" type="search" placeholder="Hľadať skladbu alebo interpreta…" autocomplete="off">
        </label>
        <div class="playlist-toolbar">
            <span>ZOZNAM SKLADIEB</span>
            <button id="favorites-filter" class="favorites-filter" type="button" aria-pressed="false">
                <i class="far fa-heart" aria-hidden="true"></i> Obľúbené
            </button>
        </div>
        <ul id="playlist" class="playlist-list"></ul>
        <p id="playlist-empty" class="playlist-empty" hidden>Nenašli sa žiadne skladby.</p>
    </aside>
    </div>


    <div class="playlist-backdrop" id="playlist-backdrop"></div>
    <div class="skin-picker-backdrop" id="skin-picker-backdrop" hidden>
      <section class="skin-picker" role="dialog" aria-modal="true" aria-labelledby="skin-picker-title">
        <header class="skin-picker-header">
          <div><p class="skin-picker-eyebrow">VZHĽAD PREHRÁVAČA</p><h2 id="skin-picker-title">Vyber si dizajn</h2>
          <p class="skin-picker-subtitle">Farebná téma zostáva nezávislá od dizajnu.</p></div>
          <button class="skin-picker-close" id="skin-picker-close" type="button" aria-label="Zavrieť"><i class="fas fa-times" aria-hidden="true"></i></button>
        </header>
        <div class="skin-options" id="skin-options">
          <button class="skin-option" type="button" data-skin-choice="midnight-glass" aria-pressed="false"><span class="skin-preview preview-midnight"><span></span><i></i><b></b></span><span class="skin-option-copy"><strong>Midnight Glass</strong></span></button>
          <button class="skin-option" type="button" data-skin-choice="neon-cyber" aria-pressed="false"><span class="skin-preview preview-neon"><span></span><i></i><b></b></span><span class="skin-option-copy"><strong>Neon Cyber</strong></span></button>
          <button class="skin-option" type="button" data-skin-choice="vinyl-retro" aria-pressed="false"><span class="skin-preview preview-vinyl"><span></span><i></i><b></b></span><span class="skin-option-copy"><strong>Vinyl Retro</strong></span></button>
          <button class="skin-option" type="button" data-skin-choice="minimal-studio" aria-pressed="false"><span class="skin-preview preview-minimal"><span></span><i></i><b></b></span><span class="skin-option-copy"><strong>Prism Atelier</strong></span></button>
          <button class="skin-option" type="button" data-skin-choice="liquid-glass" aria-pressed="false"><span class="skin-preview preview-liquid"><span></span><i></i><b></b></span><span class="skin-option-copy"><strong>Liquid Glass</strong></span></button>
          <button class="skin-option" type="button" data-skin-choice="modern-dashboard" aria-pressed="false"><span class="skin-preview preview-dashboard"><span></span><i></i><b></b></span><span class="skin-option-copy"><strong>Modern Dashboard</strong></span></button>
        </div>
      </section>
    </div>
    <script src="script.js?v=20261101-14"></script>
</body>
</html>
