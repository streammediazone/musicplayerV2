<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Môj Hudobný Prehrávač</title>
    <link rel="stylesheet" href="style.css?v=20261031-2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="player-shell">
    <div class="player-container">
        <div class="song-image">
            <img src="obrazky/f1 album.jpg" alt="Obal albumu" id="cover">
        </div>
        <h2 id="song-title">Názov Skladby</h2>
        <h3 id="song-artist">Meno Interpreta</h3>
        <span id="song-number" class="song-info">1/27</span>
        <audio id="audio" preload="metadata"></audio>
<div class="progress-container">
            <div class="progress" id="progress"></div>
        </div>
        <div class="duration-wrapper">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <i class="fas fa-backward" id="prev" title="Predchádzajúca"></i>
            <i class="fas fa-play main-button" id="play" title="Prehrať"></i>
            <i class="fas fa-forward" id="next" title="Ďalšia"></i>
        </div>

        <div class="volume-container">
            <i class="fas fa-volume-down"></i>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
            <i class="fas fa-volume-up"></i>
        </div>

        <div class="playback-options">
            <i class="fas fa-redo-alt" id="repeat" title="Opakovať"></i>
            <i class="fas fa-random" id="shuffle" title="Náhodné prehrávanie"></i>
            <i class="fas fa-list" id="toggle-playlist-btn" title="Zoznam skladieb"></i> </div>

    </div>

    <aside class="playlist-container" id="playlist-container" aria-hidden="true" aria-label="Playlist">
        <div class="playlist-header">
            <div>
                <p class="playlist-eyebrow">TVOJA HUDBA</p>
                <h2>Playlist</h2>
                <span id="playlist-count" class="playlist-count">27 skladieb</span>
            </div>
            <button class="playlist-close" id="close-playlist-btn" type="button" aria-label="Zavrieť playlist">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <label class="playlist-search">
            <i class="fas fa-search" aria-hidden="true"></i>
            <input id="playlist-search" type="search" placeholder="Hľadať skladbu alebo interpreta…" autocomplete="off">
        </label>
        <div class="playlist-toolbar">
            <span>ZOZNAM SKLADIEB</span>
            <button id="favorites-filter" class="favorites-filter" type="button" aria-pressed="false">
                <i class="far fa-heart" aria-hidden="true"></i> Obľúbené
            </button>
        </div>
        <ul id="playlist" class="playlist-list"></ul>
        <p id="playlist-empty" class="playlist-empty" hidden>Nenašli sa žiadne skladby.</p>
    </aside>
    </div>

    <div class="playlist-backdrop" id="playlist-backdrop"></div>
    <script src="script.js"></script>
</body>
</html>
